name: CI

on:
  push:
  pull_request:

# Read-only token: the pipeline only checks out code and uploads artifacts
permissions:
  contents: read

# A newer push to the same branch (or PR) makes the older run pointless
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  claims-api:
    name: claims-api (build and test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: claims-api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Includes the Testcontainers integration tests; Docker is preinstalled on ubuntu-latest
      - run: ./mvnw -B verify

  notification-service:
    name: notification-service (build and test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: notification-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: ./mvnw -B verify

  claims-web:
    name: claims-web (lint, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: claims-web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: claims-web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    name: e2e (Compose stack and Playwright)
    needs: [claims-api, notification-service, claims-web]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Start the stack
        run: |
          cp .env.example .env
          docker compose up --build -d --wait

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright and Chromium
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run the end-to-end tests
        working-directory: e2e
        run: npm test

      # The next two steps run only when something above failed
      - name: Collect the Compose logs
        if: failure()
        run: docker compose logs --no-color > compose-logs.txt

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14

      - name: Upload the Compose logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: compose-logs
          path: compose-logs.txt
          retention-days: 14

      - name: Stop the stack
        if: always()
        run: docker compose down -v
