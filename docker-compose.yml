# Local stack for the claims portal.
#
#   cp .env.example .env        # first time only
#   docker compose up -d --wait
#
# Milestone 1: supporting infrastructure only. The application services are
# added in milestone 6.

name: claims-portal

services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env (see .env.example)}
      CLAIMS_DB_PASSWORD: ${CLAIMS_DB_PASSWORD:?set in .env (see .env.example)}
      NOTIFICATIONS_DB_PASSWORD: ${NOTIFICATIONS_DB_PASSWORD:?set in .env (see .env.example)}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d claims && pg_isready -U postgres -d notifications"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?set in .env (see .env.example)}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set in .env (see .env.example)}
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 12

  mailpit:
    image: axllent/mailpit:v1.31
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "1025:1025"     # SMTP
      - "8025:8025"     # web inbox + REST API
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  rabbitmq-data:
