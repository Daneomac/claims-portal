# Local stack for the claims portal: supporting infrastructure plus the three apps.
#
#   cp .env.example .env              # first time only
#   docker compose up --build -d --wait
#   -> http://localhost:3000          # the claim form
#
# Observability: the apps log one JSON object per line (Elastic Common Schema), and send
# their trace spans to Jaeger. One submission is a single trace across both services:
#   -> http://localhost:16686        # Jaeger UI (traces are kept in memory only)
#
# Start order is enforced with healthchecks: postgres/rabbitmq/mailpit first, then
# claims-api and notification-service, then claims-web (nginx). `--wait` returns
# once everything is healthy. Secrets come from .env (git-ignored); compose refuses
# to start if one is missing. Stop with `docker compose down` (add `-v` to also
# delete the database and broker data).

name: claims-portal

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env (see .env.example)}
      CLAIMS_DB_PASSWORD: ${CLAIMS_DB_PASSWORD:?set in .env (see .env.example)}
      NOTIFICATIONS_DB_PASSWORD: ${NOTIFICATIONS_DB_PASSWORD:?set in .env (see .env.example)}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d claims && pg_isready -U postgres -d notifications"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?set in .env (see .env.example)}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set in .env (see .env.example)}
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 12

  mailpit:
    image: axllent/mailpit:v1.31
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "1025:1025"     # SMTP
      - "8025:8025"     # web inbox + REST API
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Trace viewer (Jaeger v2 all-in-one: OTLP receiver, in-memory storage and the UI). Only
  # used for looking at traces; the apps work without it (spans that can't be sent are dropped).
  jaeger:
    image: jaegertracing/jaeger:2.22.0
    ports:
      - "16686:16686"   # web UI; the apps send spans to port 4318 (OTLP over HTTP) on the compose network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:13133/status"]
      interval: 5s
      timeout: 3s
      retries: 20

  claims-api:
    build: ./claims-api
    environment:
      # JSON log lines for a log pipeline; IDE and test runs keep Spring's readable format
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
      # Without an endpoint (IDE, tests) spans are created for the logs but not exported
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      DB_HOST: postgres
      RABBITMQ_HOST: rabbitmq
      CLAIMS_DB_PASSWORD: ${CLAIMS_DB_PASSWORD:?set in .env (see .env.example)}
      RABBITMQ_USER: ${RABBITMQ_USER:?set in .env (see .env.example)}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?set in .env (see .env.example)}
    ports:
      - "8080:8080"     # also reachable directly for curl demos; the web app uses it via nginx
    mem_limit: 768m     # the JVM sizes its heap from this (-XX:MaxRAMPercentage in the Dockerfile)
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      jaeger:
        condition: service_started   # only so early spans have somewhere to go; not a hard dependency
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  notification-service:
    build: ./notification-service
    environment:
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      DB_HOST: postgres
      RABBITMQ_HOST: rabbitmq
      SMTP_HOST: mailpit
      NOTIFICATIONS_DB_PASSWORD: ${NOTIFICATIONS_DB_PASSWORD:?set in .env (see .env.example)}
      RABBITMQ_USER: ${RABBITMQ_USER:?set in .env (see .env.example)}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?set in .env (see .env.example)}
    ports:
      - "8081:8081"     # actuator only (health, metrics)
    mem_limit: 768m
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      jaeger:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8081/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  claims-web:
    build: ./claims-web
    ports:
      - "3000:8080"     # nginx listens on 8080 inside the container (non-root can't use 80)
    depends_on:
      claims-api:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost: BusyBox wget tries IPv6 ::1 first and nginx listens on IPv4 only
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
  rabbitmq-data:
