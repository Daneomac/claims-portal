# nginx server for the claims web app (ADR 0006: one origin for the SPA and the API).
# This file replaces /etc/nginx/conf.d/default.conf, which the stock nginx.conf
# includes inside its `http { }` block, so http-level directives are allowed here.

server_tokens off;                     # don't advertise the nginx version

# --- Abuse protection ---------------------------------------------------------
# One bucket per client IP, 5 requests/second on average. Claim submission is
# a human clicking a button, so this is generous for people and tight for scripts.
# Behind a real load balancer you would restore the client IP (realip module)
# so users aren't all counted as the proxy's address.
limit_req_zone $binary_remote_addr zone=api:10m rate=5r/s;
limit_req_status 429;                  # "Too Many Requests" instead of nginx's default 503

# --- Compression --------------------------------------------------------------
gzip on;
gzip_vary on;
gzip_min_length 256;
gzip_types text/css application/javascript application/json image/svg+xml;

server {
    listen 8080;                       # unprivileged port; Compose publishes it as 3000
    root /usr/share/nginx/html;
    index index.html;

    # The form is tiny (~1 KB of JSON). Anything larger is rejected with 413
    # before it reaches the API.
    client_max_body_size 16k;

    # --- Security headers -------------------------------------------------------
    # `always` adds them to error responses (404, 429, 502...) too.
    # They are set only here, at server level, because an add_header inside a
    # location block would silently replace all of these. Caching below therefore
    # uses `expires`, which doesn't have that problem.
    #
    # CSP: everything must come from this origin. No inline scripts or styles, no
    # third-party hosts. `data:` images cover small assets Vite inlines.
    # frame-ancestors 'none' stops other sites embedding this page (clickjacking);
    # X-Frame-Options is the older header with the same effect.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # Strict-Transport-Security is deliberately absent: this stack is plain HTTP
    # on localhost. It belongs on the TLS-terminating edge in a real deployment.

    # --- Container healthcheck (doesn't depend on the API) ---------------------
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --- API: same origin, so no CORS needed -----------------------------------
    location /api/ {
        limit_req zone=api burst=10 nodelay;   # allow short bursts, then 429

        # Docker's embedded DNS. Using a variable in proxy_pass makes nginx look the
        # name up at request time (valid=10s) instead of once at startup, so it
        # survives claims-api being recreated with a new IP, and nginx can start
        # before claims-api is up. With a variable and no URI part, the request
        # path (/api/v1/claims) is passed through unchanged.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://claims-api:8080;
        proxy_pass $api_upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }

    # --- Actuator is internal: never proxied ------------------------------------
    # Without this, the SPA fallback below would answer /actuator/* with index.html
    # and a misleading 200.
    location /actuator {
        return 404;
    }

    # --- Static assets -----------------------------------------------------------
    # Vite names files /assets/<name>-<content hash>.js|css, so a given URL never
    # changes content and browsers may keep it for a year.
    location /assets/ {
        expires 1y;
        try_files $uri =404;           # a missing asset is a 404, not index.html
    }

    # --- SPA ------------------------------------------------------------------------
    # index.html must be revalidated on every load (`expires epoch` sends
    # `Cache-Control: no-cache`, so the browser asks, gets a cheap 304 when
    # unchanged, and always picks up new hashed asset names after a deploy).
    # Unknown paths fall back to index.html so client-side URLs survive a reload.
    location / {
        expires epoch;
        try_files $uri /index.html;
    }
}
